<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Explainer Text Parser</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 20px;
    }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      min-height: 220px;
      padding: 10px;
      background: #0b1220;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      resize: vertical;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--accent);
      color: #0b1220;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,.15);
    }
    .error {
      color: #fca5a5;
      font-size: 12px;
      margin-top: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Explainer Text Parser</h1>
  <div class="grid">
    <div class="panel">
      <div class="label">Input (text format)</div>
      <textarea id="inputText" placeholder="Paste explainer text here..."></textarea>
      <div class="controls">
        <button id="parseBtn">Parse</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>
      <div id="errorBox" class="error" style="display:none;"></div>
    </div>
    <div class="panel">
      <div class="label">Output (parsed JSON)</div>
      <textarea id="outputText" readonly></textarea>
      <div class="controls">
        <button id="copyBtn">Copy JSON</button>
      </div>
    </div>
  </div>

  <script src="explain_parser.js"></script>
  <script>
    const input = document.getElementById("inputText");
    const output = document.getElementById("outputText");
    const parseBtn = document.getElementById("parseBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");
    const errorBox = document.getElementById("errorBox");

    function showError(msg) {
      errorBox.style.display = msg ? "block" : "none";
      errorBox.textContent = msg || "";
    }

    parseBtn.onclick = () => {
      showError("");
      try {
        const result = window.parseLectureText(input.value || "");
        output.value = JSON.stringify(result, null, 2);
      } catch (err) {
        showError(err && err.message ? err.message : String(err));
      }
    };

    clearBtn.onclick = () => {
      input.value = "";
      output.value = "";
      showError("");
    };

    copyBtn.onclick = async () => {
      if (!output.value) return;
      await navigator.clipboard.writeText(output.value);
    };
  </script>
</body>
</html>
