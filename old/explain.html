async function loadLectureFromText(text, name = "") {
  const raw = text || "";
  state.sourceText = raw;
  let parsed = null;
  const trimmed = raw.trim();
  if (trimmed) {
    try {
      parsed = JSON.parse(trimmed);
    } catch {
      parsed = null;
    }
  }
  let normalized = null;
  if (parsed !== null) {
    normalized = normalizeLectureData(parsed);
  }
  if (!normalized && window.parseLectureText) {
    normalized = window.parseLectureText(raw);
  }
  if (!normalized || !Array.isArray(normalized.commands)) {
    throw new Error("Could not parse lecture");
  }
  resetForLecture(normalized);
  setSourceStatus(name ? `Loaded: ${name}` : "Loaded");
}

async function loadLectureFromUrl(url) {
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`Failed to load (${res.status})`);
  }
  const text = await res.text();
  await loadLectureFromText(text, url);
}

function loadLectureFromScript(url) {
  return new Promise((resolve, reject) => {
    const existing = document.querySelector("script[data-lecture-script]");
    if (existing) existing.remove();
    window.lecture = null;
    window.lectureText = null;
    const script = document.createElement("script");
    script.src = url;
    script.dataset.lectureScript = "1";
    script.onload = () => {
      const normalized = normalizeLectureData(window.lecture)
        || (window.lectureText && window.parseLectureText ? window.parseLectureText(window.lectureText) : null);
      if (!normalized || !Array.isArray(normalized.commands)) {
        reject(new Error("Script did not define a lecture"));
        return;
      }
      if (window.lectureText) state.sourceText = window.lectureText;
      resetForLecture(normalized);
      setSourceStatus(`Loaded: ${url}`);
      resolve();
    };
    script.onerror = () => reject(new Error("Failed to load script"));
    document.head.appendChild(script);
  });
}

const DEFAULT_TUTORIALS = {
  owner: "explainify",
  repo: "tutorials",
  branch: "main",
};
const DEFAULT_TUTORIALS_INDEX_URL = `https://raw.githubusercontent.com/${DEFAULT_TUTORIALS.owner}/${DEFAULT_TUTORIALS.repo}/${DEFAULT_TUTORIALS.branch}/index.json`;

function buildRawGithubUrl(owner, repo, branch, filePath) {
  const safePath = String(filePath || "")
    .split("/")
    .map((segment) => encodeURIComponent(segment))
    .join("/");
  return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${safePath}`;
}

function extractEmbeddedUrl(input) {
  const match = String(input || "").match(/https?:\/\/[^\s]+/i);
  if (!match) return "";
  return match[0].replace(/[)\],.]+$/g, "");
}

function normalizeGithubToRaw(url) {
  try {
    const parsed = new URL(url);
    const host = parsed.hostname.toLowerCase();
    if (host === "raw.githubusercontent.com") return parsed.toString();
    if (host === "github.com" || host === "www.github.com") {
      const parts = parsed.pathname.split("/").filter(Boolean);
      if (parts.length >= 5 && (parts[2] === "blob" || parts[2] === "tree" || parts[2] === "raw")) {
        const [owner, repo, , branch, ...rest] = parts;
        if (!rest.length) return parsed.toString();
        return buildRawGithubUrl(owner, repo, branch, rest.join("/"));
      }
      return parsed.toString();
    }
    return parsed.toString();
  } catch {
    return url;
  }
}

function resolveGithubShorthand(input) {
  const parts = String(input || "").split("/").filter(Boolean);
  if (parts.length < 3) return null;
  const [owner, repo, ...rest] = parts;
  if (rest[0] === "blob" || rest[0] === "tree" || rest[0] === "raw") {
    if (rest.length < 3) return null;
    const [, branch, ...pathParts] = rest;
    if (!pathParts.length) return null;
    return buildRawGithubUrl(owner, repo, branch, pathParts.join("/"));
  }
  return buildRawGithubUrl(owner, repo, DEFAULT_TUTORIALS.branch, rest.join("/"));
}

function resolveEditorInputToUrl(value) {
  const input = String(value || "").trim();
  if (!input) return null;
  const embedded = extractEmbeddedUrl(input);
  if (embedded) return normalizeGithubToRaw(embedded);
  if (sourceMap[input]) return sourceMap[input];
  if (/^https?:\/\//i.test(input)) return normalizeGithubToRaw(input);
  if (/^github\.com\//i.test(input)) return normalizeGithubToRaw(`https://${input}`);
  if (/^raw\.githubusercontent\.com\//i.test(input)) return `https://${input}`;
  if (/^\.{0,2}\//.test(input)) return input;
  if (/^[\w.-]+\/[\w.-]+\/.+/.test(input)) {
    return resolveGithubShorthand(input) || input;
  }
  return buildRawGithubUrl(DEFAULT_TUTORIALS.owner, DEFAULT_TUTORIALS.repo, DEFAULT_TUTORIALS.branch, input);
}

function populateEditorUrlList(items) {
  if (!els.editorListSelect) return;
  els.editorListSelect.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select a tutorial…";
  els.editorListSelect.appendChild(placeholder);
  items.forEach((item) => {
    const opt = document.createElement("option");
    opt.value = item.id;
    opt.textContent = item.title && item.title !== item.id
      ? `${item.id} — ${item.title}`
      : item.id;
    els.editorListSelect.appendChild(opt);
  });
}

function editorListIsLoaded() {
  if (!els.editorListSelect) return false;
  return els.editorListSelect.options.length > 1;
}

function normalizeTutorialIndex(data) {
  const items = [];
  const pushItem = (entry) => {
    if (!entry) return;
    if (typeof entry === "string") {
      items.push({ id: entry, title: "" });
      return;
    }
    if (typeof entry === "object") {
      const id = entry.id || entry.name || entry.slug || entry.file;
      if (!id) return;
      const title = entry.title || entry.label || entry.name || entry.id || "";
      items.push({ id, title });
    }
  };
  if (Array.isArray(data)) {
    data.forEach(pushItem);
    return items;
  }
  if (data && Array.isArray(data.tutorials)) {
    data.tutorials.forEach(pushItem);
    return items;
  }
  if (data && Array.isArray(data.items)) {
    data.items.forEach(pushItem);
  }
  return items;
}

async function loadEditorTutorialList() {
  setEditorStatus("Loading tutorial list...");
  try {
    const res = await fetch(DEFAULT_TUTORIALS_INDEX_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`Index not found (${res.status})`);
    const text = await res.text();
    let items = [];
    try {
      const data = JSON.parse(text);
      items = normalizeTutorialIndex(data);
    } catch {
      items = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((id) => ({ id, title: "" }));
    }
    items.sort((a, b) => a.id.localeCompare(b.id));
    populateEditorUrlList(items);
    setEditorStatus(`Loaded list (${items.length}) from index`);
    return;
  } catch {
    // Fall back to GitHub API below.
  }

  try {
    const apiUrl = `https://api.github.com/repos/${DEFAULT_TUTORIALS.owner}/${DEFAULT_TUTORIALS.repo}/contents?ref=${DEFAULT_TUTORIALS.branch}`;
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error(`List failed (${res.status})`);
    const data = await res.json();
    const items = Array.isArray(data)
      ? data
        .filter((entry) => entry.type === "file" && entry.name && !entry.name.startsWith("."))
        .map((entry) => ({ id: entry.name, title: "" }))
      : [];
    items.sort((a, b) => a.id.localeCompare(b.id));
    populateEditorUrlList(items);
    setEditorStatus(`Loaded list (${items.length}) from GitHub API`);
  } catch (err) {
    setEditorStatus(String(err), true);
  }
}

/* ---------------- UI wiring ---------------- */

async function loadEditorFromUrl(value) {
  const url = resolveEditorInputToUrl(value);
  if (!url) {
    setEditorStatus("Unknown id or URL", true);
    return;
  }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Failed to load (${res.status})`);
    const text = await res.text();
    if (els.editorTextarea) {
      els.editorTextarea.value = text;
      state.editorText = text;
    }
    setEditorStatus(`Loaded into editor: ${url}`);
    await applyEditorContent({ play: false });
  } catch (err) {
    setEditorStatus(String(err), true);
  }
}

async function applyEditorContent({ play = false } = {}) {
  if (state.editorApplying) return false;
  state.editorApplying = true;
  const text = els.editorTextarea ? els.editorTextarea.value : "";
  state.editorText = text;
  state.sourceText = text;
  try {
    if (text === state.editorLastAppliedText) {
      setEditorStatus("No changes to apply");
      state.editorApplying = false;
      if (play) startPlayback();
      return true;
    }
    await loadLectureFromText(text, "editor");
    state.editorLastAppliedText = text;
    setEditorStatus("Loaded from editor");
    if (play) startPlayback();
    state.editorApplying = false;
    return true;
  } catch (err) {
    setEditorStatus(String(err), true);
    state.editorApplying = false;
    return false;
  }
}

function scheduleEditorAutoApply() {
  if (state.editorAutoApplyTimer) clearTimeout(state.editorAutoApplyTimer);
  state.editorAutoApplyTimer = setTimeout(() => {
    state.editorAutoApplyTimer = null;
    applyEditorContent({ play: false });
  }, 300);
}

async function setEditorOpen(open, opts = {}) {
  if (!els.editorPane || !els.board) return;
  if (open) {
    if (state.editorClosing || state.editorOpen) return;
    state.editorOpen = true;
    cancelAll();
    state.playing = false;
    state.paused = true;
    state.waitingForClick = null;
    hideCenterPlay();
    els.editorPane.classList.add("visible");
    if (els.playerWrap) els.playerWrap.style.display = "none";
    els.board.style.display = "none";
    if (els.editorTextarea) {
      els.editorTextarea.value = state.editorText || state.sourceText || "";
      els.editorTextarea.focus();
    }
    syncEditorToggle();
    showBottomBar();
    return;
  }
  if (state.editorClosing) return;
  state.editorClosing = true;
  const shouldApply = opts.apply ?? true;
  const shouldPlay = opts.play ?? false;
  let ok = true;
  if (shouldApply) {
    ok = await applyEditorContent({ play: false });
  }
  if (!ok) {
    state.editorClosing = false;
    return;
  }
  state.editorOpen = false;
  els.editorPane.classList.remove("visible");
  if (els.playerWrap) els.playerWrap.style.display = "";
  els.board.style.display = "";
  state.editorClosing = false;
  syncEditorToggle();
  if (shouldPlay) setTimeout(() => startPlayback(), 0);
}

async function applyEditorAndPlay() {
  if (state.editorApplying || state.editorClosing) return;
  state.editorClosing = true;
  state.editorOpen = false;
  if (els.editorPane) els.editorPane.classList.remove("visible");
  if (els.playerWrap) els.playerWrap.style.display = "";
  if (els.board) els.board.style.display = "";
  syncEditorToggle();
  state.editorClosing = false;
  const ok = await applyEditorContent({ play: false });

    url = input;
  }
  if (!url) {
    setSourceStatus("Unknown source id", true);
    return;

  setSourceStatus("Loading...");
  try {

    hideCenterPlay();
  }
}

<script>
/* ---------------- Text parser to lecture JSON ---------------- */

function parseArgs(argText = "") {
  const args = {};
  const text = argText.trim();
  if (!text) return args;
  const parts = [];
  let current = "";
  let inQuote = false;
  let quoteChar = "";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if ((ch === '"' || ch === "'") && (i === 0 || text[i - 1] !== "\\")) {
      if (!inQuote) {
        inQuote = true;
        quoteChar = ch;
      } else if (quoteChar === ch) {
        inQuote = false;
        quoteChar = "";
      }
    }
    if (ch === "," && !inQuote) {
      parts.push(current);
      current = "";
    } else {
      current += ch;
    }
  }
  if (current.trim()) parts.push(current);
  parts.forEach((part) => {
    const [rawKey, ...rest] = part.split("=");
    const key = (rawKey || "").trim();
    if (!key) return;
    const rawVal = rest.join("=").trim();
    if (!rawVal) {
      args[key] = true;
      return;
    }
    const v = rawVal.replace(/^['"]|['"]$/g, "");
    if (v === "true") args[key] = true;
    else if (v === "false") args[key] = false;
    else if (!Number.isNaN(Number(v)) && v !== "") args[key] = Number(v);
    else args[key] = v;
  });
  return args;
}

function inferBlockType(content = "") {
  const text = content.trim();
  if (!text) return "write";
  const head = text.split("\n")[0].trim();
  if (/^(flowchart|sequenceDiagram|graph|gantt|classDiagram|stateDiagram)/i.test(head)) return "mermaid";
  if (/(function\s+setup|function\s+draw|createCanvas\s*\()/i.test(text)) return "p5";
  if (/(import\s+\w+|def\s+\w+|print\s*\(|plt\.)/i.test(text)) return "pyodide";
  if (/(<-|library\s*\(|ggplot\s*\(|tibble\s*\()/i.test(text)) return "webr";
  return "write_speak";
}

function splitArgsList(text = "") {
  const parts = [];
  let current = "";
  let inQuote = false;
  let quoteChar = "";
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if ((ch === '"' || ch === "'") && (i === 0 || text[i - 1] !== "\\")) {
      if (!inQuote) {
        inQuote = true;
        quoteChar = ch;
      } else if (quoteChar === ch) {
        inQuote = false;
        quoteChar = "";
      }
    }
    if (ch === "," && !inQuote) {
      parts.push(current.trim());
      current = "";
    } else {
      current += ch;
    }
  }
  if (current.trim()) parts.push(current.trim());
  return parts.map((part) => {
    const v = part.replace(/^['"]|['"]$/g, "");
    if (v === "true") return true;
    if (v === "false") return false;
    if (!Number.isNaN(Number(v)) && v !== "") return Number(v);
    return v;
  });
}

function parseDrawLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return null;
  if (trimmed.startsWith("{")) {
    try {
      const obj = JSON.parse(trimmed);
      if (obj && !obj.cmd && obj.type) {
        obj.cmd = obj.type;
        delete obj.type;
      }
      return { type: "draw", ...obj };
    } catch {
      return null;
    }
  }
  const funcMatch = trimmed.match(/^([a-zA-Z0-9_-]+)\s*\((.*)\)\s*(.*)$/);
  if (funcMatch) {
    const cmd = funcMatch[1];
    const argList = splitArgsList(funcMatch[2] || "");
    const rest = funcMatch[3] || "";
    const args = {};
    if (cmd === "line" && argList.length >= 4) {
      [args.x1, args.y1, args.x2, args.y2] = argList;
    } else if (cmd === "text" && argList.length >= 3) {
      [args.x, args.y, args.text] = argList;
    } else if (cmd === "polygon" && argList.length >= 6) {
      const pts = [];
      for (let i = 0; i < argList.length; i += 2) {
        if (argList[i + 1] === undefined) break;
        pts.push([Number(argList[i]), Number(argList[i + 1])]);
      }
      args.points = pts;
    } else if (cmd === "path" && argList.length >= 1) {
      args.d = String(argList[0]);
    }
    if (rest) {
      rest.split(/\s+/).forEach((tok) => {
        const [k, ...vparts] = tok.split("=");
        if (!k) return;
        const vraw = vparts.join("=");
        const v = vraw.replace(/^['"]|['"]$/g, "");
        if (v === "true") args[k] = true;
        else if (v === "false") args[k] = false;
        else if (!Number.isNaN(Number(v)) && v !== "") args[k] = Number(v);
        else args[k] = v;
      });
    }
    return { type: "draw", cmd, ...args };
  }
  const [cmd, ...rest] = trimmed.split(/\s+/);
  const args = {};
  rest.forEach((tok) => {
    const [k, ...vparts] = tok.split("=");
    if (!k) return;
    const vraw = vparts.join("=");
    const v = vraw.replace(/^['"]|['"]$/g, "");
    if (v === "true") args[k] = true;
    else if (v === "false") args[k] = false;
    else if (!Number.isNaN(Number(v)) && v !== "") args[k] = Number(v);
    else args[k] = v;
  });
  return { type: "draw", cmd, ...args };
}

function parseDrawLines(content = "") {
  const lines = content.split("\n").map((l) => l.trim()).filter(Boolean);
  const out = [];
  lines.forEach((line) => {
    const cmd = parseDrawLine(line);
    if (cmd) out.push(cmd);
  });
  return out;
}

function parseQuestionBlock(content = "") {
  const lines = content.split("\n").map((l) => l.trim()).filter(Boolean);
  const prompt = lines.shift() || "";
  const choices = [];
  const correct = [];
  lines.forEach((line) => {
    const isCorrect = line.startsWith("*");
    const clean = line.replace(/^[-*]\s?/, "");
    if (clean) {
      if (isCorrect) correct.push(choices.length);
      choices.push(clean);
    }
  });
  return { markdown: prompt, choices, correct_indices: correct };
}

function parseMarkdownTable(content = "") {
  const lines = content.split("\n").map((l) => l.trim()).filter(Boolean);
  if (lines.length < 2) return null;
  const sepIdx = lines.findIndex((line) => /\|?\s*:?-{3,}:?\s*\|/.test(line));
  if (sepIdx <= 0) return null;
  const headerLine = lines[sepIdx - 1];
  const bodyLines = lines.slice(sepIdx + 1);
  const parseRow = (line) => {
    const trimmed = line.replace(/^\||\|$/g, "");
    return trimmed.split("|").map((cell) => cell.trim());
  };
  const headers = parseRow(headerLine);
  const rows = bodyLines.map(parseRow).filter((row) => row.some((cell) => cell !== ""));
  return { headers, rows };
}

function parseCsvLine(line = "") {
  const out = [];
  let current = "";
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"' && line[i + 1] === '"') {
      current += '"';
      i += 1;
      continue;
    }
    if (ch === '"') {
      inQuote = !inQuote;
      continue;
    }
    if (ch === "," && !inQuote) {
      out.push(current.trim());
      current = "";
      continue;
    }
    current += ch;
  }
  out.push(current.trim());
  return out;
}

function parseCsvTable(content = "") {
  const lines = content.split("\n").map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  const headers = parseCsvLine(lines[0]);
  const rows = lines.slice(1).map(parseCsvLine).filter((row) => row.some((cell) => cell !== ""));
  return { headers, rows };
}

function parseLectureText(text = "") {
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const blocks = [];
  let current = null;

  const pushCurrent = () => {
    if (!current) return;
    const hasContent = current.content && current.content.some((l) => l.trim() !== "");
    if (current.name || hasContent) {
      blocks.push(current);
    }
    current = null;
  };

  lines.forEach((line) => {
    const trimmed = line.trim();
    if (trimmed.startsWith(":::")) {
      pushCurrent();
      const header = trimmed.replace(/^:::+/, "").trim();
      let name = "";
      let args = {};
      if (header) {
        const match = header.match(/^([a-zA-Z0-9_-]+)\s*(?:\((.*)\))?$/);
        if (match) {
          name = match[1];
          args = parseArgs(match[2] || "");
        } else {
          name = header.split(/\s+/)[0];
        }
      }
      current = { name, args, content: [] };
    } else {
      if (!current) current = { name: "", args: {}, content: [] };
      current.content.push(line);
    }
  });
  pushCurrent();

  const defaults = {};
  const commands = [];

  blocks.forEach((blk) => {
    const content = (blk.content || []).join("\n").trim();
    let type = blk.name || inferBlockType(content);
    if (type === "python") type = "pyodide";
    if (type === "r") type = "webr";
    const args = blk.args || {};

    if (type === "defaults") {
      Object.assign(defaults, args);
      if (content) {
        content.split("\n").forEach((line) => {
          const [k, ...vparts] = line.split("=");
          if (!k) return;
          const v = vparts.join("=").trim();
          if (!v) return;
          defaults[k.trim()] = parseArgs(`x=${v}`).x;
        });
      }
      return;
    }

    if (type === "new_page") {
      commands.push({ type: "new_page", title: args.title || content || "" });
      return;
    }

    if (type === "wait") {
      commands.push({ type: "wait", ...args, label: args.label || content || undefined });
      return;
    }

    if (type === "highlight") {
      const payload = { type: "annotate", target: "code", ...args };
      if (content && !payload.code_text && !payload.text) {
        payload.code_text = content;
      }
      commands.push(payload);
      return;
    }

    if (type === "dim" || type === "no_dim") {
      const payload = { type, ...args };
      if (content && payload.index === undefined && payload.slice === undefined && payload.range === undefined) {
        payload.index = content;
      }
      commands.push(payload);
      return;
    }

    if (type === "annotate_table") {
      const payload = { type: "annotate", target: "table", ...args };
      if (content && !payload.text) {
        payload.text = content;
      }
      commands.push(payload);
      return;
    }

    if (type === "speak") {
      commands.push({ type: "speak", text: content, ...args });
      return;
    }

    if (type === "math") {
      commands.push({ type: "math", text: content, ...args });
      return;
    }

    if (type === "message") {
      commands.push({ type: "message", text: content, ...args });
      return;
    }

    if (type === "tutorial_link") {
      const url = args.url || args.href || args.src || content;
      const text = args.text || args.title || content || url || "Open tutorial";
      commands.push({ type: "tutorial_link", url, text, ...args });
      return;
    }

    if (type === "write" || type === "write_speak") {
      commands.push({ type, markdown: content, ...args });
      return;
    }

    if (type === "draw") {
      const drawCmds = parseDrawLines(content);
      drawCmds.forEach((cmd) => commands.push({ ...cmd, ...args }));
      return;
    }

    if (type === "multiple_choice") {
      const q = parseQuestionBlock(content);
      commands.push({ type: "question", ...q, ...args });
      return;
    }

    if (type === "question") {
      const hasQaArgs = args.question || args.answer || args.hint || args.gif || args.gif_src || args.gif_url;
      if (!hasQaArgs && content) {
        const q = parseQuestionBlock(content);
        commands.push({ type: "question", ...q, ...args });
        return;
      }
      const payload = {
        type: "question",
        question: args.question || content || "",
        answer: args.answer,
        hint: args.hint,
        gif: args.gif,
        gif_src: args.gif_src || args.gif_url || (typeof args.gif === "string" ? args.gif : undefined),
        ...args,
      };
      commands.push(payload);
      return;
    }

    if (type === "table") {
      const parsed = parseMarkdownTable(content);
      if (parsed) {
        commands.push({ type: "table", headers: parsed.headers, rows: parsed.rows, ...args });
        return;
      }
      commands.push({ type: "table", headers: [], rows: [], ...args });
      return;
    }

    if (type === "pyodide" || type === "webr" || type === "p5" || type === "mermaid" || type === "js") {
      commands.push({ type, code: content, ...args });
      return;
    }

    if (type === "html") {
      const allowHtml = args.allow_html ?? true;
      commands.push({ type: "html", html: content, ...args, allow_html: allowHtml });
      return;
    }

    if (type === "pdf") {
      const src = args.src || content || "";
      commands.push({ type: "pdf", src, ...args });
      return;
    }

    commands.push({ type: "write_speak", markdown: content, ...args });
  });

  return { defaults, commands };
}

window.parseLectureText = parseLectureText;

</script>

(async () => {
  if (!window.lectureText || typeof window.loadLectureFromText !== "function") return;

    await loadLectureFromText(window.lectureText, "embedded");
  } catch (err) {
    console.warn("Failed to load embedded lecture:", err);
  }
})();
</script>
