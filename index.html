     TCP+TLS to these origins before the first request, cutting ~50-150ms on
     cold cache per origin. -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<!-- Preload the biggest local script so it starts downloading alongside the
     CDN libraries during HTML parsing instead of waiting until the end of body. -->
